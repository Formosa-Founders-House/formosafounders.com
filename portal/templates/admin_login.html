{% extends "base.html" %}
{% block title %}管理員登入 · Formosa House{% endblock %}
{% block robots %}noindex,nofollow{% endblock %}
{% block body_class %}admin-body{% endblock %}
{% block content %}
<section class="login-shell">
  <div class="login-copy">
    <p class="eyebrow">HOUSE OPERATIONS</p>
    <h1>門，從這裡<br><em>開始管理。</em></h1>
    <p>審核申請、安排面試、做出決定並管理臨時門禁。</p>
  </div>
  <form method="post" class="login-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p class="card-kicker">ADMIN SIGN IN</p>
    <h2>管理員登入</h2>
    <label>Email
      <input type="email" name="email" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="primary-action" type="submit">登入後台 <span>→</span></button>
  </form>
</section>
{% endblock %}
